name: Public harness checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/audit_public.py
      - run: python -m pip install -r requirements.txt
      - run: python harness.py setup
      - run: python harness.py test
      - run: python harness.py smoke --output-dir ../mathmodel-smoke
