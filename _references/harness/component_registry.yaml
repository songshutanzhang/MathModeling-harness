schema_version: '1.0'
evidence_snapshot: null
allowed_dispositions:
- CORE
- GUARD
- LAZY
- MERGE
- EXPERIMENTAL
- DELETE
components:
- id: runtime-preflight
  layer: kernel
  owner_stage: orchestration
  primary_responsibility: 在任何计算前验证活动入口依赖闭包、运行依赖、规则版本与所请求 effort/topology/receipt 能力。
  trigger: all runs before bounded tasks
  inputs:
  - active_skill_root
  - repository_release
  - contest_rule_source
  - model_capability_snapshot
  outputs:
  - run/PREFLIGHT.json
  - run/CONTEST_RULES.json
  dependencies: []
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: 在活动依赖缺失或正式运行能力不可满足时先消耗求解预算，最后才暴露协议失败。
  capability_ledger:
    floor: high
    ceiling: neutral
    evidence_confidence: low
  complexity_ledger:
    context: low
    state: low
    coupling: medium
    maintenance: medium
  disposition: CORE
  replacement: null
  migration: 新 run 必须先生成可执行 preflight；旧 run 保留 legacy 缺口，不追造历史回执。
  rollback_trigger: 预检误判使合法入口无法启动或未能发现实际缺失依赖。
  rollback_steps: 回退到已备份活动安装并保留失败预检供修复，不绕过 formal 能力缺口。
  trigger_owner: runtime
  active_profiles:
  - reference
  - draft
  - audit
  - contest
  active_stages:
  - orchestration
  owner: orchestration
  recurring_cost:
    status: missing
    dimensions:
    - wall_clock_seconds
    - tool_calls
- id: problem-freeze
  layer: kernel
  owner_stage: analysis
  primary_responsibility: 在候选生成前冻结题意、规则、输入和暴露边界。
  trigger: all runs
  inputs:
  - official_problem
  - official_attachments
  outputs:
  - modeling/g2/PROBLEM_FREEZE.json
  dependencies: []
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: 题意或输入在候选比较后漂移。
  capability_ledger:
    floor: high
    ceiling: neutral
    evidence_confidence: low
  complexity_ledger:
    context: low
    state: low
    coupling: medium
    maintenance: low
  disposition: CORE
  replacement: null
  migration: 保留单一冻结入口。
  rollback_trigger: 冻结文件无法被 G2/G5 校验器消费。
  rollback_steps: 回退到 harness_pre_meta_v1 的冻结格式。
  trigger_owner: runtime
  active_profiles:
  - reference
  - draft
  - audit
  - contest
  active_stages:
  - analysis
  owner: analysis
  recurring_cost:
    status: missing
    dimensions:
    - input_tokens
    - wall_clock_seconds
    - tool_calls
    - context_peak
- id: g2-tournament
  layer: kernel
  owner_stage: analysis
  primary_responsibility: 隔离生成异质候选并用盲评、原型和可靠性门槛选择路线。
  trigger: training_run, evaluation_run, live_competition
  inputs:
  - modeling/g2/PROBLEM_FREEZE.json
  outputs:
  - modeling/g2/ROUTE_SELECTION.yaml
  dependencies:
  - problem-freeze
  - reasoning-router
  - topology-controller
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: 单一路线锚定或创新分覆盖硬错误。
  capability_ledger:
    floor: high
    ceiling: high
    evidence_confidence: low
  complexity_ledger:
    context: medium
    state: medium
    coupling: medium
    maintenance: medium
  disposition: CORE
  replacement: null
  migration: 保留；候选数量与早停规则仅在实验配置中变化。
  rollback_trigger: 异质候选率或未见题质量显著下降。
  rollback_steps: 恢复基线候选与选择契约。
  trigger_owner: runtime
  active_profiles:
  - draft
  - audit
  - contest
  active_stages:
  - analysis
  owner: analysis
  recurring_cost:
    status: missing
    dimensions:
    - input_tokens
    - wall_clock_seconds
    - tool_calls
    - context_peak
- id: solver-execution
  layer: kernel
  owner_stage: coding
  primary_responsibility: 执行已选路线，绑定计算与来源依赖、公平候选晋级及结构上限处置证据。
  trigger: all full solution runs
  inputs:
  - model_contract
  - official_data
  outputs:
  - code
  - result_artifacts
  dependencies:
  - g2-tournament
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: 模型只停留在叙述而没有可复现实证。
  capability_ledger:
    floor: high
    ceiling: high
    evidence_confidence: low
  complexity_ledger:
    context: medium
    state: medium
    coupling: high
    maintenance: medium
  disposition: CORE
  replacement: null
  migration: 保持 problem-specific 实现，不引入统一基类。
  rollback_trigger: 结果合同或复现入口失效。
  rollback_steps: 按 case 恢复原 solve entrypoint。
  trigger_owner: runtime
  active_profiles:
  - draft
  - audit
  - contest
  active_stages:
  - coding
  owner: coding
  recurring_cost:
    status: missing
    dimensions:
    - input_tokens
    - wall_clock_seconds
    - tool_calls
    - context_peak
- id: results-contract
  layer: kernel
  owner_stage: coding
  primary_responsibility: 提供论文、图表和验证共享的数值事实源。
  trigger: all full solution runs
  inputs:
  - solver_outputs
  outputs:
  - results/results.json
  dependencies:
  - solver-execution
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: 论文数值与代码结果分叉。
  capability_ledger:
    floor: high
    ceiling: neutral
    evidence_confidence: low
  complexity_ledger:
    context: low
    state: low
    coupling: high
    maintenance: low
  disposition: CORE
  replacement: null
  migration: 保持唯一事实源；减少派生文档复制。
  rollback_trigger: 下游无法稳定绑定 result_id。
  rollback_steps: 恢复基线 schema 与 validator。
  trigger_owner: runtime
  active_profiles:
  - draft
  - audit
  - contest
  active_stages:
  - coding
  - writing
  - verification
  owner: coding
  recurring_cost:
    status: missing
    dimensions:
    - input_tokens
    - wall_clock_seconds
    - tool_calls
    - context_peak
- id: independent-validation
  layer: kernel
  owner_stage: verification
  primary_responsibility: 独立复核约束、数值、鲁棒性和求解器修复。
  trigger: after solver response
  inputs:
  - results_contract
  - solver_response
  outputs:
  - validation_report
  - independent_validation
  dependencies:
  - results-contract
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: Solver 自证与未闭合硬错误。
  capability_ledger:
    floor: high
    ceiling: medium
    evidence_confidence: low
  complexity_ledger:
    context: medium
    state: medium
    coupling: medium
    maintenance: medium
  disposition: CORE
  replacement: null
  migration: 保留验证职责；取消与 Writer 的重复数值检查。
  rollback_trigger: 误阻断率上升或独立性丢失。
  rollback_steps: 恢复基线 G5 验证顺序。
  trigger_owner: runtime
  active_profiles:
  - draft
  - audit
  - contest
  active_stages:
  - coding
  - verification
  owner: verification
  recurring_cost:
    status: missing
    dimensions:
    - input_tokens
    - wall_clock_seconds
    - tool_calls
    - context_peak
- id: semantic-package
  layer: kernel
  owner_stage: coding
  primary_responsibility: 把方程、假设、result_id、图和限制冻结为供 Writer 消费的语义证据包。
  trigger: all full solution runs
  inputs:
  - results_contract
  - validation_report
  outputs:
  - run/SEMANTIC_ARTIFACT_PACKAGE.yaml
  dependencies:
  - results-contract
  - independent-validation
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: 训练被版式链阻断或 Writer 改写数值。
  capability_ledger:
    floor: medium
    ceiling: medium
    evidence_confidence: low
  complexity_ledger:
    context: medium
    state: low
    coupling: medium
    maintenance: low
  disposition: CORE
  replacement: null
  migration: 由 3coding 负责冻结输入包；不得同时生成论文正文。
  rollback_trigger: 语义论文缺少可审查的关键内容。
  rollback_steps: 对风险 run 升级 audit profile。
  trigger_owner: runtime
  active_profiles:
  - draft
  - audit
  - contest
  active_stages:
  - coding
  - writing
  owner: coding
  recurring_cost:
    status: missing
    dimensions:
    - input_tokens
    - wall_clock_seconds
    - tool_calls
    - context_peak
- id: semantic-writer
  layer: kernel
  owner_stage: writing
  primary_responsibility: 只把冻结语义证据包转换为 paper.md，不改变模型或数值事实。
  trigger: all full solution runs after semantic package freeze
  inputs:
  - run/SEMANTIC_ARTIFACT_PACKAGE.yaml
  outputs:
  - paper/paper.md
  dependencies:
  - semantic-package
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: 训练被 Word 版式链阻断或 Writer 改写数值。
  capability_ledger:
    floor: medium
    ceiling: medium
    evidence_confidence: low
  complexity_ledger:
    context: medium
    state: low
    coupling: medium
    maintenance: low
  disposition: CORE
  replacement: null
  migration: Tier 1 止于 paper.md；Word 延迟加载。
  rollback_trigger: paper.md 缺失关键公式、结果绑定或限制。
  rollback_steps: 修复 Writer 转换，不改写语义包。
  trigger_owner: runtime
  active_profiles:
  - draft
  - audit
  - contest
  active_stages:
  - writing
  owner: writing
  recurring_cost:
    status: missing
    dimensions:
    - input_tokens
    - wall_clock_seconds
    - tool_calls
    - context_peak
- id: run-ledger
  layer: kernel
  owner_stage: governance
  primary_responsibility: 通过全流程任务图保存计算及外部节点、有效批准、可恢复发布、成本分账和当前下一步。
  trigger: all runs
  inputs:
  - run_artifacts
  - runtime_telemetry
  outputs:
  - run_record
  dependencies:
  - runtime-preflight
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: 把估计成本或人工印象当成精确证据。
  capability_ledger:
    floor: medium
    ceiling: medium
    evidence_confidence: low
  complexity_ledger:
    context: low
    state: low
    coupling: low
    maintenance: low
  disposition: CORE
  replacement: null
  migration: 新 run 登记数值、评审、写作和批准节点；历史只做回溯，不把文件存在当成 completed。
  rollback_trigger: 采集器改变或污染原始 run。
  rollback_steps: 禁用采集写入，只保留只读扫描。
  trigger_owner: runtime
  active_profiles:
  - reference
  - draft
  - audit
  - contest
  active_stages:
  - orchestration
  - analysis
  - coding
  - drawing
  - writing
  - verification
  owner: governance
  recurring_cost:
    status: missing
    dimensions:
    - input_tokens
    - wall_clock_seconds
    - tool_calls
    - context_peak
- id: reasoning-router
  layer: kernel
  owner_stage: orchestration
  primary_responsibility: 按有界任务记录实际 model_id、reasoning_effort、topology、回执、降级和复评状态。
  trigger: all runs and every bounded reasoning task
  inputs:
  - execution_mode
  - model_capability_snapshot
  - task_class
  - risk_signals
  outputs:
  - run/REASONING_ROUTE_LEDGER.jsonl
  - model_application_receipt
  dependencies:
  - run-ledger
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: 训练无法路由，或在无生效回执时声称已切换模型/effort。
  capability_ledger:
    floor: high
    ceiling: high
    evidence_confidence: low
  complexity_ledger:
    context: low
    state: medium
    coupling: medium
    maintenance: medium
  disposition: CORE
  replacement: human_gate.py legacy route-* state
  migration: 所有新 run 使用独立 route ledger；Gate 只引用 completed route event。
  rollback_trigger: 路由账本阻断正常 High fallback 或出现状态链错误。
  rollback_steps: 切回 harness_pre_meta_v1，并保留新账本作只读证据。
  trigger_owner: runtime
  active_profiles:
  - reference
  - draft
  - audit
  - contest
  active_stages:
  - orchestration
  - analysis
  - coding
  - drawing
  - writing
  - verification
  owner: orchestration
  recurring_cost:
    status: missing
    dimensions:
    - input_tokens
    - wall_clock_seconds
    - tool_calls
    - context_peak
- id: topology-controller
  layer: conditional
  owner_stage: orchestration
  primary_responsibility: 只在请求非 single 拓扑时验证独立上下文、统一冻结输入和隔离输出回执。
  trigger: requested topology is independent_candidates, dual_review, or ensemble
  inputs:
  - frozen_input_hash
  - model_capability_snapshot
  - isolated_execution_receipts
  outputs:
  - topology_execution_receipt
  dependencies:
  - reasoning-router
  observed_invocation_count: null
  observed_contribution: Private observations omitted; validate in your own environment.
  worst_failure_prevented: 把顺序文件隔离或单上下文执行伪装成真正独立审查。
  capability_ledger:
    floor: high
    ceiling: high
    evidence_confidence: low
  complexity_ledger:
    context: low
    state: medium
    coupling: medium
    maintenance: medium
  disposition: LAZY
  replacement: null
  migration: G2/G5 或元审查请求非 single 时调用；实际 single 自动降级披露。
  rollback_trigger: 隔离回执成本超过收益或运行时无法稳定提供 context 标识。
  rollback_steps: 退化为 single 并降低独立性证据置信度，不移除冻结输入约束。
  trigger_owner: runtime
  active_profiles:
  - draft
  - audit
  - contest
  active_stages:
  - orchestration
  - analysis
  - coding
  - verification
  owner: orchestration
  recurring_cost:
    status: missing
    dimensions:
    - input_tokens
    - wall_clock_seconds
    - tool_calls
    - context_peak
